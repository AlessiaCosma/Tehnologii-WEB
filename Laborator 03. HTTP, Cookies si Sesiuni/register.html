<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inregistrare</title>
        <link rel="stylesheet" href="style.css">
        <script src="./js/storage.js"></script>
        <script src="./js/register.js"></script>
    </head>
    <body>
        <div class="container" id="register">
            <form id="register-form">
                <label>Username: <input type="text" id="username" required></label><br>
                <label>Email: <input type="email" id="email" required></label><br>
                <label>Parola: <input type="password" id="password" required></label><br>
                <label>Confirmare parola: <input type="password" id="confirm" required></label><br>
                <button type="submit">Inregistreaza-te</button>
            </form>
            <p id="register-msg"></p>
        </div>
    </body>
</html>
